name: userspace arena Android qualification

on:
  push:
    branches:
      - sun/reusable-userspace-arena
    paths:
      - 'lib/appendfat_arena.c'
      - 'lib/appendfat_arena.h'
      - 'android/arena-c67/**'
      - '.github/workflows/arena-c67-apk.yml'
  pull_request:
    paths:
      - 'lib/appendfat_arena.c'
      - 'lib/appendfat_arena.h'
      - 'android/arena-c67/**'
      - '.github/workflows/arena-c67-apk.yml'

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi:
          - armeabi-v7a
          - arm64-v8a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build sandbox APK
        env:
          ANDROID_ABI: ${{ matrix.abi }}
        run: sh android/arena-c67/build.sh
      - name: Upload exact APK and receipt
        uses: actions/upload-artifact@v4
        with:
          name: appendfat-arena-${{ matrix.abi }}
          path: |
            android/arena-c67/build-${{ matrix.abi }}/appendfat-arena-${{ matrix.abi }}.apk
            android/arena-c67/build-${{ matrix.abi }}/receipt.txt
          if-no-files-found: error
          retention-days: 14
