name: C67 userspace arena APK

on:
  push:
    branches:
      - sun/c67-userspace-arena-apk
    paths:
      - 'tools/appendfat_arena.c'
      - 'android/arena-c67/**'
      - '.github/workflows/arena-c67-apk.yml'

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-c67:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build arm64-v8a sandbox APK
        run: sh android/arena-c67/build.sh
      - name: Upload exact APK and receipt
        uses: actions/upload-artifact@v4
        with:
          name: appendfat-arena-c67-arm64-v8a
          path: |
            android/arena-c67/build/appendfat-arena-c67-arm64-v8a.apk
            android/arena-c67/build/receipt.txt
          if-no-files-found: error
          retention-days: 14
