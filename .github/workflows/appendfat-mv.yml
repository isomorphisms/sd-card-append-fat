name: appendfat_mv safety tests

on:
  push:
    branches:
      - main
    paths:
      - 'android/Makefile'
      - '.github/actions/ick-host/action.yml'
      - 'ci/Makefile'
      - 'ci/build-toolchain.tsv'
      - 'docs/division-migration.md'
      - 'tools/appendfat_mv.c'
      - 'tests/appendfat-mv.sh'
      - 'tests/appendfat-mv-faults.c'
      - 'tests/appendfat-mv-mutations.sh'
      - 'tests/physical-sd-readonly-preflight.sh'
      - 'tests/physical-appendfat-mv-scratch.sh'
      - 'tests/physical-phone-appendfat-mv-acceptance.sh'
      - 'docs/appendfat-mv.md'
      - 'docs/phone-keep-size-probe-2026-09-18.md'
      - 'AGENTS.md'
      - '.github/workflows/appendfat-mv.yml'
  pull_request:
    paths:
      - 'android/Makefile'
      - '.github/actions/ick-host/action.yml'
      - 'ci/Makefile'
      - 'ci/build-toolchain.tsv'
      - 'docs/division-migration.md'
      - 'tools/appendfat_mv.c'
      - 'tests/appendfat-mv.sh'
      - 'tests/appendfat-mv-faults.c'
      - 'tests/appendfat-mv-mutations.sh'
      - 'tests/physical-sd-readonly-preflight.sh'
      - 'tests/physical-appendfat-mv-scratch.sh'
      - 'tests/physical-phone-appendfat-mv-acceptance.sh'
      - 'docs/appendfat-mv.md'
      - 'docs/phone-keep-size-probe-2026-09-18.md'
      - 'AGENTS.md'
      - '.github/workflows/appendfat-mv.yml'

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-test:
    name: host safety tests (ICK)
    runs-on: ubuntu-latest
    steps:
      - name: Check out appendfat repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: ick
        uses: ./.github/actions/ick-host

      - name: Build and exercise appendfat_mv
        env:
          ICK: ${{ steps.ick.outputs.compiler }}
        run: sh tests/appendfat-mv.sh

  mutation-test:
    name: dangerous mutants must fail
    runs-on: ubuntu-latest
    steps:
      - name: Check out appendfat repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: ick
        uses: ./.github/actions/ick-host

      - name: Prove the safety suite rejects known-bad movers
        env:
          ICK: ${{ steps.ick.outputs.compiler }}
        run: sh tests/appendfat-mv-mutations.sh

  armv7-android-compile:
    name: Android ARMv7 / Thumb-2 compile
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out appendfat repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: 015cc7901ae0b3ad262b476f24e129b53c56db95
          path: .ai-ci-ick
          persist-credentials: false
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - run: sdkmanager "ndk;27.2.12479018"
      - uses: isomorphisms/ai-ci/ick-android@015cc7901ae0b3ad262b476f24e129b53c56db95
        with:
          abi: armeabi-v7a
          ndk: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018

      - name: Compile for Android API 24 ARMv7
        run: |
          make -f android/Makefile mv ABI=armeabi-v7a ANDROID_API=24 NDK="$ANDROID_HOME/ndk/27.2.12479018" ICK_STAGE="${{ runner.temp }}/ick-android-armeabi-v7a-stage" OUTPUT=/tmp/appendfat_mv-armv7
          file /tmp/appendfat_mv-armv7

  physical-script-static-check:
    name: physical SD harness static check
    runs-on: ubuntu-latest
    steps:
      - name: Check out appendfat repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Parse scratch-only physical scripts
        run: |
          sh -n tests/physical-sd-readonly-preflight.sh
          sh -n tests/physical-appendfat-mv-scratch.sh
          bash -n tests/physical-phone-appendfat-mv-acceptance.sh

      - name: Refuse dangerous recursive deletion in physical scripts
        run: |
          if grep -nE 'rm[[:space:]]+-[[:alnum:]]*r|rm[[:space:]]+--recursive' \
              tests/physical-sd-readonly-preflight.sh \
              tests/physical-appendfat-mv-scratch.sh \
              tests/physical-phone-appendfat-mv-acceptance.sh; then
            echo 'physical SD scripts must never use recursive deletion' >&2
            exit 1
          fi

      - name: Require explicit scratch arming
        run: |
          grep -F 'APPENDFAT_MV_PHYSICAL_SCRATCH' \
              tests/physical-appendfat-mv-scratch.sh >/dev/null
