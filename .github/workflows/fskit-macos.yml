name: FSKit macOS SDK compilation (diagnostic only)
on:
  pull_request:
    paths:
      - 'macos/fskit/**'
      - 'lib/appendfat_arena.c'
      - 'lib/appendfat_arena.h'
      - 'tests/fskit-bridge.c'
      - 'tests/fskit-bridge.sh'
      - '.github/workflows/fskit-macos.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  macos-sdk-probe:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Record environment
        run: |
          sw_vers -productVersion
          uname -m
          xcodebuild -version
      - name: Compile FSKit API and host (NO live core, NO release)
        run: |
          xcodebuild -project macos/fskit/AppendFATFSKit.xcodeproj \
            -scheme AppendFATFSKit -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_CFLAGS=-DAPPENDFAT_FSKIT_SDK_PROBE=1 build
  ick-core-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ick
        uses: ./.github/actions/ick-host
      - name: Verify append/read/EOF/overflow via pinned ICK
        env:
          ICK: ${{ steps.ick.outputs.compiler }}
        run: sh tests/fskit-bridge.sh
