name: QEMU FAT image equivalence

on:
  push:
    branches:
      - main
    paths:
      - 'fs/appendfat/**'
      - 'scripts/install-appendfat-into-linux.sh'
      - 'tests/qemu-fat-equivalence.sh'
      - 'tests/qemu-fat-equivalence-init'
      - '.github/workflows/qemu-fat-equivalence.yml'
  pull_request:
    paths:
      - 'fs/appendfat/**'
      - 'scripts/install-appendfat-into-linux.sh'
      - 'tests/qemu-fat-equivalence.sh'
      - 'tests/qemu-fat-equivalence-init'
      - '.github/workflows/qemu-fat-equivalence.yml'

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  equivalence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out appendfat repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out pinned Linux source
        uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: 238650ef6c7c7cca08e032527329424c9fbd70e5
          path: linux
          fetch-depth: 1

      - name: Install build and VM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev qemu-system-x86 busybox-static dosfstools cpio

      - name: Run stock-to-appendfat-to-stock FAT32 round trip
        run: sh tests/qemu-fat-equivalence.sh linux
