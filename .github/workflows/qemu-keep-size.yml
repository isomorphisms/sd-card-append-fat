name: QEMU appendfat keep-size reservation

on:
  push:
    branches:
      - main
    paths:
      - 'fs/appendfat/**'
      - 'scripts/install-appendfat-into-linux.sh'
      - 'tests/qemu-common.sh'
      - 'tests/qemu-keep-size.sh'
      - 'tests/qemu-keep-size-characterization.sh'
      - 'tests/fallocate-keep-size.c'
      - 'tests/qemu-keep-size-init'
      - 'tests/qemu-fallocate-reserve-init'
      - 'tests/qemu-fallocate-consume-init'
      - 'tests/qemu-fallocate-full-consume-init'
      - '.github/workflows/qemu-keep-size.yml'
  pull_request:
    paths:
      - 'fs/appendfat/**'
      - 'scripts/install-appendfat-into-linux.sh'
      - 'tests/qemu-common.sh'
      - 'tests/qemu-keep-size.sh'
      - 'tests/qemu-keep-size-characterization.sh'
      - 'tests/fallocate-keep-size.c'
      - 'tests/qemu-keep-size-init'
      - 'tests/qemu-fallocate-reserve-init'
      - 'tests/qemu-fallocate-consume-init'
      - 'tests/qemu-fallocate-full-consume-init'
      - '.github/workflows/qemu-keep-size.yml'

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  keep-size:
    runs-on: ubuntu-latest
    steps:
      - name: Check out appendfat repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out pinned Linux source
        uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: 238650ef6c7c7cca08e032527329424c9fbd70e5
          path: linux
          fetch-depth: 1

      - name: Install build and VM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev qemu-system-x86 busybox-static dosfstools cpio

      - name: Characterize FALLOC_FL_KEEP_SIZE compatibility
        run: sh tests/qemu-keep-size.sh linux

      - name: Characterize reservation persistence across clean unmount
        run: sh tests/qemu-keep-size-characterization.sh linux
